name: CI

on:
  push:
    branches: [main]
  pull_request:
    # "labeled" lets the slow label start a run.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 5 * * 1"  # weekly: catches upstream breakage and runs the slow suite
  workflow_dispatch:

# A new push to a branch cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    # The pre-commit hooks are the single pin of the lint and format tools.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pipx run pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    # A hung process pool fails the job instead of holding a runner for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
        include:
          - { os: ubuntu-latest, python-version: "3.13", cov: "--cov=binference --cov-report=term-missing" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test,xarray]"
      - run: pytest ${{ matrix.cov }}
        env:
          OMP_NUM_THREADS: "2"

  minimum-dependencies:
    # The lowest versions that pyproject.toml allows for the direct dependencies.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install uv && uv pip install --system --resolution lowest-direct -e ".[test]"
      - run: pytest

  slow:
    # Weekly, by hand, or on a pull request labelled "slow".
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'slow')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      - run: pytest -m slow --durations=20
        env:
          OMP_NUM_THREADS: "1"

  linkcheck:
    # Weekly or by hand: external links break without any change here.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs,xarray]"
      - run: sphinx-build -b linkcheck docs docs/_build/linkcheck
        env:
          BINFERENCE_DOCS_EXECUTE: "off"
      - name: Check that every DOI in the bibliography is registered
        run: python docs/_scripts/check_dois.py

  docs:
    # Pushes to main also publish the site to GitHub Pages (deploy job below).
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs,xarray]"
      - name: Check the brand assets and tokens against docs/_scripts/brand.py
        run: python docs/_scripts/brand.py --check
      - name: Check the defaults page against the code and its docstrings
        run: python docs/_scripts/defaults_table.py --check
      - name: Run the code of the README, installation page and guides
        run: python docs/_scripts/run_snippets.py README.md docs/start/install.md docs/guides/*.md
      # Executed notebooks are reused until the tutorials, the package, the plot style or the docs
      # configuration change; the weekly run always executes them afresh.
      - if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: docs/_build/.jupyter_cache
          key: jupyter-${{ hashFiles('docs/tutorials/**', 'src/**', 'pyproject.toml', 'docs/conf.py', 'docs/_ext/matplotlibrc') }}
      - name: Build, with warnings as errors, executing the tutorials
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  dist:
    # Builds the wheel and the sdist and imports the wheel in a clean environment.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # -I keeps the working directory off the import path.
      - run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/clean/bin/python" -I -c "import binference; print(binference.__version__)"
