name: CI

on:
  push:
    branches: [main]
  pull_request:
    # "labeled" lets the slow label start a run.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 5 * * 1"  # weekly: catches upstream breakage and runs the slow suite
  workflow_dispatch:

# A new push to a branch cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    # What a pull request touches, so docs-only changes skip the test matrix and code-only
    # changes skip nothing they could break. Pushes to main, the weekly run and manual runs
    # run every job.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code: &code
              - "src/**"
              - "tests/**"
              - "pyproject.toml"
              - ".github/workflows/**"
              # packed into the sdist and checked by the dist job or the tests
              - "README.md"
              - "LICENSE"
              - "CHANGELOG.md"
              - "CITATION.cff"
            docs:
              - *code
              - "docs/**"
              - "benchmarks/**"  # read by docs/how-it-works/auto.md
              - "CONTRIBUTING.md"
              - "reports/**"  # included by docs/design/landscape.md

  lint:
    # The pre-commit hooks are the single pin of the lint and format tools.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pipx run pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: [lint, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    # A hung process pool fails the job instead of holding a runner for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
        include:
          - { os: ubuntu-latest, python-version: "3.13", cov: "--cov=binference --cov-report=term-missing" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test,xarray]"
      - run: pytest ${{ matrix.cov }}
        env:
          OMP_NUM_THREADS: "2"

  minimum-dependencies:
    # The lowest versions that pyproject.toml allows for the direct dependencies.
    needs: [lint, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install uv && uv pip install --system --resolution lowest-direct -e ".[test]"
      - run: pytest

  slow:
    # Weekly, by hand, or on a pull request labelled "slow".
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'slow')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      - run: pytest -m slow --durations=20
        env:
          OMP_NUM_THREADS: "1"

  linkcheck:
    # Weekly or by hand: external links break without any change here.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs,xarray]"
      - run: sphinx-build -b linkcheck docs docs/_build/linkcheck
        env:
          BINFERENCE_DOCS_EXECUTE: "off"
      - name: Check that every DOI in the bibliography is registered
        if: ${{ !cancelled() }}
        run: python docs/_scripts/check_dois.py

  docs:
    # Pushes to main also publish the site to GitHub Pages (deploy job below).
    needs: [lint, changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs,xarray,test]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # the still frames are exact strings; CONTRIBUTING names this version
      - name: Check the brand assets and tokens against docs/_scripts/brand.py
        run: python docs/_scripts/brand.py --check
      - name: Check the defaults page against the code and its docstrings
        run: python docs/_scripts/defaults_table.py --check
      - name: Check the explainers' still frames and their maths against binference
        run: |
          node docs/_scripts/explainers.mjs --check
          pytest tests/test_explainers.py
      - name: Run the code of the README, installation page and guides
        run: python docs/_scripts/run_snippets.py README.md docs/index.md docs/start/install.md docs/guides/*.md docs/guides/inputs/*.md
      # Executed notebooks are reused while the package, the plot style and the docs
      # configuration are unchanged; within that, a cache from other page text is restored
      # and only notebooks whose code cells changed run again. The weekly run neither reads
      # nor writes the cache, so it executes every notebook.
      - if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: docs/_build/.jupyter_cache
          key: jupyter-${{ hashFiles('src/**', 'pyproject.toml', 'docs/conf.py', 'docs/_ext/**', 'benchmarks/**') }}-${{ hashFiles('docs/**/*.md') }}
          restore-keys: jupyter-${{ hashFiles('src/**', 'pyproject.toml', 'docs/conf.py', 'docs/_ext/**', 'benchmarks/**') }}-
      - name: Build, with warnings as errors, executing the tutorials
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  dist:
    # Builds the wheel and the sdist and imports the wheel in a clean environment.
    needs: [lint, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # -I keeps the working directory off the import path.
      - run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/clean/bin/python" -I -c "import binference; print(binference.__version__)"

  ci-ok:
    # One check that sums up a run, for branch protection: it fails when a job failed or was
    # cancelled, and passes when jobs were skipped because the change cannot affect them.
    if: always()
    needs: [lint, test, minimum-dependencies, docs, dist]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "every job that applies passed"
