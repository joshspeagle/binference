name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly: catches upstream breakage and runs the slow suite
  workflow_dispatch:

# A new push to a branch cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.17.1"  # same version as .pre-commit-config.yaml
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    # A hung process pool fails the job instead of holding a runner for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test,xarray]"
      - run: pytest --cov=binference --cov-report=term-missing
        env:
          OMP_NUM_THREADS: "2"

  minimum-dependencies:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "numpy==2.1.*" "scipy==1.14.*" "matplotlib==3.9.*" "threadpoolctl==3.1.*" -e ".[test]"
      - run: pytest

  slow:
    # Weekly, by hand, or on a pull request labelled "slow".
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'slow')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[test]"
      - run: pytest -m slow --durations=20
        env:
          OMP_NUM_THREADS: "1"

  docs:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs]"
      - name: Run the code of the README, installation page and user guide
        run: python docs/_scripts/run_snippets.py README.md docs/install.md docs/user-guide/*.md
      - name: Build, with warnings as errors, executing the tutorials
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  dist:
    # Builds the wheel and the sdist and imports the wheel in a clean environment.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # -I keeps the working directory off the import path.
      - run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/clean/bin/python" -I -c "import binference; print(binference.__version__)"
